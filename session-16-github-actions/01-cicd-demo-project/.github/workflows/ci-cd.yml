# Session 16 - CI/CD pipeline with GitHub Actions
# A copy of this file is kept in session-16-github-actions/01-cicd-demo-project/.github/workflows/ci-cd.yml
# GitHub only runs workflows from the repo root .github/workflows/ folder, so this is the active copy.

name: Session 16 - CI/CD Pipeline

on:
  push:
    branches: [main]
    paths:
      - "session-16-github-actions/**"
      - ".github/workflows/session-16-ci-cd.yml"
  pull_request:
    branches: [main]
    paths:
      - "session-16-github-actions/**"
      - ".github/workflows/session-16-ci-cd.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  APP_DIR: session-16-github-actions/01-cicd-demo-project
  IMAGE_NAME: ghcr.io/shubhamk0205/session16-cicd-demo
  PYTHON_VERSION: "3.13"

jobs:
  # ==================== CI ====================

  test:
    name: "CI - Test"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.APP_DIR }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Show runner details
        run: |
          echo "Runner OS   : ${{ runner.os }}"
          echo "Runner arch : ${{ runner.arch }}"
          echo "Runner name : ${{ runner.name }}"
          echo "Event       : ${{ github.event_name }}"
          echo "Commit      : ${{ github.sha }}"

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run unit tests
        run: pytest -v --junitxml=test-results.xml

      - name: Upload test report (artifact)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: ${{ env.APP_DIR }}/test-results.xml

  build:
    name: "CI - Build"
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.APP_DIR }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Build application
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Show build info
        run: cat build/build-info.txt

      - name: Upload build (artifact)
        uses: actions/upload-artifact@v7
        with:
          name: app-build
          path: ${{ env.APP_DIR }}/build/app-build.tar.gz

  docker-build:
    name: "CI - Docker Build"
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.APP_DIR }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Build Docker image
        run: docker build -t session16-demo:${{ github.sha }} .

      - name: Smoke test the container
        run: |
          docker run -d --name smoke -p 5000:5000 session16-demo:${{ github.sha }}
          sleep 3
          curl -sf http://localhost:5000/health
          echo
          curl -sf "http://localhost:5000/api/calc?op=add&a=2&b=3"
          echo
          docker rm -f smoke

      - name: Save image as tar
        run: docker save session16-demo:${{ github.sha }} | gzip > image.tar.gz

      - name: Upload image (artifact)
        uses: actions/upload-artifact@v7
        with:
          name: docker-image
          path: ${{ env.APP_DIR }}/image.tar.gz
          retention-days: 1

  # ==================== CD ====================

  deliver:
    name: "CD - Push Image to GHCR"
    needs: [build, docker-build]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v8
        with:
          name: docker-image

      - name: Load image
        run: gunzip -c image.tar.gz | docker load

      - name: Login to GHCR (uses GITHUB_TOKEN)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push image
        run: |
          docker tag session16-demo:${{ github.sha }} $IMAGE_NAME:${{ github.sha }}
          docker tag session16-demo:${{ github.sha }} $IMAGE_NAME:latest
          docker push $IMAGE_NAME:${{ github.sha }}
          docker push $IMAGE_NAME:latest

  deploy:
    name: "CD - Deploy to Staging (runner)"
    needs: deliver
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: app-build

      - name: Show build info from artifact
        run: tar -xzf app-build.tar.gz build-info.txt && cat build-info.txt

      - name: Login to GHCR (uses GITHUB_TOKEN)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull image from GHCR
        run: docker pull $IMAGE_NAME:${{ github.sha }}

      - name: Deploy container (secret passed as env var)
        env:
          APP_MESSAGE: ${{ secrets.APP_ENV_MESSAGE }}
        run: |
          if [ -z "$APP_MESSAGE" ]; then
            echo "Secret APP_ENV_MESSAGE is not set!"
            exit 1
          fi
          echo "Secret length: ${#APP_MESSAGE} characters"
          echo "Secret value in logs: $APP_MESSAGE"
          docker run -d --name staging -p 8080:5000 \
            -e APP_MESSAGE="$APP_MESSAGE" \
            -e APP_VERSION=${{ github.sha }} \
            $IMAGE_NAME:${{ github.sha }}
          sleep 3
          docker ps

      - name: Verify deployment
        run: |
          curl -sf http://localhost:8080/
          echo
          curl -sf http://localhost:8080/health
          echo
          curl -sf http://localhost:8080/api/message
          echo
