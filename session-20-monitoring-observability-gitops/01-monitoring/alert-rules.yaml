apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: demo-app-alerts
  namespace: monitoring
spec:
  groups:
    - name: demo-app.rules
      rules:
        # CPU: fire when one demo-app pod uses more than 0.2 CPU core for 1 minute
        - alert: DemoAppHighCPU
          expr: sum by (pod) (rate(container_cpu_usage_seconds_total{namespace="monitoring-demo", container="web"}[1m])) > 0.2
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: "High CPU on {{ $labels.pod }}"
            description: "Pod {{ $labels.pod }} is using {{ $value | humanize }} CPU cores."
        # Memory: fire when a demo-app pod uses more than 100Mi
        - alert: DemoAppHighMemory
          expr: sum by (pod) (container_memory_working_set_bytes{namespace="monitoring-demo", container="web"}) > 100 * 1024 * 1024
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: "High memory on {{ $labels.pod }}"
        # Application health: fewer ready replicas than wanted
        - alert: DemoAppReplicasUnavailable
          expr: kube_deployment_status_replicas_available{namespace="monitoring-demo", deployment="demo-app"} < kube_deployment_spec_replicas{namespace="monitoring-demo", deployment="demo-app"}
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "demo-app has unavailable replicas"
