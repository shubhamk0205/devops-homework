apiVersion: v1
kind: Namespace
metadata:
  name: monitoring-demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app
  namespace: monitoring-demo
  labels:
    app: demo-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: demo-app
  template:
    metadata:
      labels:
        app: demo-app
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 128Mi
          # application health: readiness checks that the page is really served
          readinessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 5
          # liveness only checks that nginx is listening (process alive)
          livenessProbe:
            tcpSocket:
              port: 80
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: demo-app
  namespace: monitoring-demo
spec:
  selector:
    app: demo-app
  ports:
    - port: 80
      targetPort: 80
---
# small client that calls the app every 2 seconds, so the app writes access logs
apiVersion: apps/v1
kind: Deployment
metadata:
  name: traffic-generator
  namespace: monitoring-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: traffic-generator
  template:
    metadata:
      labels:
        app: traffic-generator
    spec:
      containers:
        - name: client
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              echo "traffic generator started"
              while true; do
                wget -q -O /dev/null http://demo-app/ && echo "GET / OK" || echo "GET / FAILED"
                wget -q -O /dev/null http://demo-app/notes || echo "GET /notes FAILED (404 expected)"
                sleep 2
              done
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
