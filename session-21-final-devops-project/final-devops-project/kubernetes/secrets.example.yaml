# EXAMPLE ONLY - placeholder values, do not put real passwords in Git.
# I create the real Secrets at runtime with kubectl (see README "Kubernetes deployment"):
#   kubectl create secret generic helpdesk-db -n helpdesk \
#     --from-literal=username=helpdesk --from-literal=password="$(openssl rand -hex 16)"
#   kubectl create secret docker-registry ghcr-pull -n helpdesk \
#     --docker-server=ghcr.io --docker-username=<github-user> --docker-password="$(gh auth token)"
apiVersion: v1
kind: Secret
metadata:
  name: helpdesk-db
  namespace: helpdesk
type: Opaque
stringData:
  username: helpdesk
  password: <CHANGE-ME>
