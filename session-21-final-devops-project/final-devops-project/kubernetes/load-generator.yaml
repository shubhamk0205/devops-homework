# Sends requests to the backend in a loop to push CPU up and make the HPA scale.
#   kubectl apply -f kubernetes/load-generator.yaml
#   kubectl delete -f kubernetes/load-generator.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: load-generator
  namespace: helpdesk
spec:
  replicas: 3
  selector:
    matchLabels: {app: load-generator}
  template:
    metadata:
      labels: {app: load-generator}
    spec:
      containers:
        - name: load
          image: busybox:1.37
          command: ["sh", "-c", "while true; do wget -q -O /dev/null http://helpdesk-backend:8000/api/tickets; wget -q -O /dev/null http://helpdesk-backend:8000/api/tickets/stats; done"]
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 32Mi}
