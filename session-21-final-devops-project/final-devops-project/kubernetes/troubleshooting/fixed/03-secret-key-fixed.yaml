# Scenario 3 - FIXED: secretKeyRef uses the real key name
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab-api
  namespace: helpdesk-lab
spec:
  replicas: 1
  selector:
    matchLabels: {app: lab-api}
  template:
    metadata:
      labels: {app: lab-api}
    spec:
      imagePullSecrets: [{name: ghcr-pull}]
      containers:
        - name: backend
          image: ghcr.io/shubhamk0205/session21-helpdesk-backend:__TAG__
          ports: [{name: http, containerPort: 8000}]
          env:
            - {name: APP_ENV, value: lab}
            - {name: DB_HOST, value: helpdesk-postgres.helpdesk.svc}
            - name: DB_USER
              valueFrom: {secretKeyRef: {name: helpdesk-db, key: username}}
            - name: DB_PASSWORD
              valueFrom: {secretKeyRef: {name: helpdesk-db, key: password}}   # <-- real key name
          readinessProbe:
            httpGet: {path: /ready, port: http}
