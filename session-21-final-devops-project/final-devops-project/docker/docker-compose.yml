# Full local stack: postgres + backend + frontend
#   cd docker && docker compose up --build
#   open http://localhost:3080
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: helpdesk
      POSTGRES_USER: helpdesk
      POSTGRES_PASSWORD: ${DB_PASSWORD:-local-dev-only}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helpdesk -d helpdesk"]
      interval: 5s
      retries: 10

  backend:
    build:
      context: ../application
      dockerfile: ../docker/backend.Dockerfile
    environment:
      APP_ENV: docker-compose
      DB_HOST: postgres
      DB_NAME: helpdesk
      DB_USER: helpdesk
      DB_PASSWORD: ${DB_PASSWORD:-local-dev-only}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8001:8000"

  frontend:
    build:
      context: ../application
      dockerfile: ../docker/frontend.Dockerfile
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      - backend
    ports:
      - "3080:8080"

volumes:
  postgres-data:
