# Light kube-prometheus-stack values for minikube (based on my session 20 values)
#   helm install monitoring prometheus-community/kube-prometheus-stack -n monitoring --create-namespace -f monitoring-values.yaml
grafana:
  adminPassword: admin123        # local demo only
  resources:
    requests: {cpu: 50m, memory: 128Mi}
  sidecar:
    dashboards:
      enabled: true              # loads every ConfigMap with label grafana_dashboard=1
      searchNamespace: ALL

alertmanager:
  enabled: false                 # not needed for this project

prometheus:
  prometheusSpec:
    retention: 1d
    scrapeInterval: 15s
    resources:
      requests: {cpu: 100m, memory: 400Mi}
    # pick up my ServiceMonitor (from the Helm chart) even without the "release" label
    serviceMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false

# minikube does not expose these control plane parts -> avoid "down" targets
kubeEtcd:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
