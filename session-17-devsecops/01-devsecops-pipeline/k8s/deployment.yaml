apiVersion: apps/v1
kind: Deployment
metadata:
  name: session17-devsecops
  labels:
    app: session17-devsecops
spec:
  replicas: 2
  selector:
    matchLabels:
      app: session17-devsecops
  template:
    metadata:
      labels:
        app: session17-devsecops
    spec:
      # secret created by the pipeline so the kind cluster can pull from GHCR
      imagePullSecrets:
        - name: ghcr-secret
      securityContext:
        runAsNonRoot: true
      containers:
        - name: app
          # __IMAGE__ is replaced by the pipeline with ghcr.io/...:<git sha>
          image: __IMAGE__
          imagePullPolicy: Always
          ports:
            - containerPort: 5001
          readinessProbe:
            httpGet:
              path: /health
              port: 5001
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 5001
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
