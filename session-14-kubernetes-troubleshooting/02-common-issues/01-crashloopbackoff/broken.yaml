# BUG: the app needs DATABASE_URL but it is not set -> app exits with code 1 -> CrashLoopBackOff
apiVersion: v1
kind: Pod
metadata:
  name: crashloop-pod
spec:
  containers:
    - name: python-app
      image: python:3.11-alpine
      command:
        - python3
        - -c
        - |
          import os, sys, time
          db_url = os.environ.get("DATABASE_URL")
          if not db_url:
              print("[FATAL ERROR]: DATABASE_URL environment variable is MISSING!", file=sys.stderr)
              sys.exit(1)
          print("Application started successfully! DB =", db_url, flush=True)
          while True:
              time.sleep(30)
