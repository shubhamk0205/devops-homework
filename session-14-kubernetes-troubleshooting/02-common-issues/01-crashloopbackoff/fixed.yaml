# FIX: give the container the DATABASE_URL environment variable
apiVersion: v1
kind: Pod
metadata:
  name: crashloop-pod
spec:
  containers:
    - name: python-app
      image: python:3.11-alpine
      env:
        - name: DATABASE_URL
          value: "postgres://db-service:5432/appdb"
      command:
        - python3
        - -c
        - |
          import os, sys, time
          db_url = os.environ.get("DATABASE_URL")
          if not db_url:
              print("[FATAL ERROR]: DATABASE_URL environment variable is MISSING!", file=sys.stderr)
              sys.exit(1)
          print("Application started successfully! DB =", db_url, flush=True)
          while True:
              time.sleep(30)
