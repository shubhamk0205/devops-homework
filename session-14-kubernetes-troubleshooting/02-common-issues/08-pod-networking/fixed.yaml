# A small Python API that other Pods call directly on its Pod IP, port 8000.
# FIX: bind to 0.0.0.0 (all interfaces) so the Pod IP is reachable from other Pods
#      (before it was 127.0.0.1 = loopback only)
apiVersion: v1
kind: Pod
metadata:
  name: api-pod
  labels:
    app: api
spec:
  containers:
    - name: api
      image: python:3.11-alpine
      command: ["python3", "-m", "http.server", "8000", "--bind", "0.0.0.0"]
      env:
        - name: PYTHONUNBUFFERED   # print access logs right away
          value: "1"
      ports:
        - containerPort: 8000
---
apiVersion: v1
kind: Pod
metadata:
  name: net-client
spec:
  containers:
    - name: busybox
      image: busybox:1.36
      command: ["sleep", "3600"]
