# A small Python API that other Pods call directly on its Pod IP, port 8000.
# BUG: the server binds to 127.0.0.1 (loopback), so it only accepts connections
#      from inside its own Pod. Other Pods get "connection refused".
apiVersion: v1
kind: Pod
metadata:
  name: api-pod
  labels:
    app: api
spec:
  containers:
    - name: api
      image: python:3.11-alpine
      command: ["python3", "-m", "http.server", "8000", "--bind", "127.0.0.1"]
      env:
        - name: PYTHONUNBUFFERED   # print access logs right away
          value: "1"
      ports:
        - containerPort: 8000
---
apiVersion: v1
kind: Pod
metadata:
  name: net-client
spec:
  containers:
    - name: busybox
      image: busybox:1.36
      command: ["sleep", "3600"]
